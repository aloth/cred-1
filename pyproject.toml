# Python package "cred1" (PyPI). The npm package @aloth/cred1 is defined in
# package.json; both ship data/cred1_compact.json and share the CalVer version,
# which is read from package.json so there is one source of truth.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cred1"
dynamic = ["version"]
description = "Credibility ratings for 2,600+ news and website domains from the CRED-1 open dataset"
readme = "python/README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-MIT"]
authors = [{ name = "Alexander Loth", email = "home@alexloth.com" }]
requires-python = ">=3.10"
keywords = ["misinformation", "disinformation", "credibility", "news", "fact-checking", "dataset", "domains"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.urls]
Homepage = "https://aloth.github.io/cred-1/"
Repository = "https://github.com/aloth/cred-1"
Issues = "https://github.com/aloth/cred-1/issues"
DOI = "https://doi.org/10.5281/zenodo.18769459"

[tool.hatch.version]
path = "package.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["python/cred1", "python/tests", "python/README.md", "data/cred1_compact.json", "package.json", "LICENSE", "LICENSE-MIT"]

[tool.hatch.build.targets.wheel]
packages = ["python/cred1"]

[tool.hatch.build.targets.wheel.force-include]
"data/cred1_compact.json" = "cred1/cred1_compact.json"
