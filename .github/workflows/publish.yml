name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      # Derive npm-compatible CalVer from Git tag: v2026-06-13 -> 2026.6.13
      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(echo "$TAG" | awk -F- '{printf "%s.%d.%d", $1, int($2), int($3)}')
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - run: npm ci
      - run: npm run build --if-present

      - name: Publish to npm
        run: npm publish --access public --provenance

      # Commit version bump back to main so package.json stays in sync
      - name: Commit version back
        run: |
          git config user.name "Alexander Loth"
          git config user.email "aloth@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

  # Lists the MCP server in the official MCP registry. A separate job, so a
  # registry outage never blocks the npm release or the Homebrew bump.
  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v4

      - name: Set version in server.json from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(echo "$TAG" | awk -F- '{printf "%s.%d.%d", $1, int($2), int($3)}')
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "server.json version: $VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # The registry checks mcpName in the published npm package, which can
      # take a minute to become visible after npm publish.
      - name: Publish server to the MCP registry
        run: |
          for i in $(seq 1 6); do
            ./mcp-publisher publish && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

  bump-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: cred1
          homebrew-tap: aloth/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/aloth/cred-1/archive/refs/tags/${{ github.ref_name }}.tar.gz
          create-pullrequest: false
          commit-message: |
            cred1: bump to {{version}}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
